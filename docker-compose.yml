services:
  # ═══════════════════════════════════════════════════════════════════
  # WAHA — WhatsApp motoru (ayri kutuda calisir)
  #
  # ONEMLI: WAHA_DEFAULT_ENGINE=GOWS
  #   NOWEB = Baileys         -> su an kullanilan; AMA WAHA'nin surec
  #                              yonetimi/yeniden baglanmasi farkli,
  #                              kararlilik kazanci buradan gelebilir.
  #                              DIKKAT: NOWEB_STORE acik olmali (asagida)
  #   GOWS  = whatsmeow (Go)  -> gruplarin %64'unun adini vermedi, birakildi
  #   WEBJS = Chrome tabanli  -> cok daha agir, alternatif
  # ═══════════════════════════════════════════════════════════════════
  waha:
    image: devlikeapro/waha:latest
    container_name: waha-test
    restart: unless-stopped
    ports:
      - "3001:3000"                 # WAHA arayuzu: http://SUNUCU:3001
    environment:
      TZ: Europe/Istanbul
      WAHA_DEFAULT_ENGINE: NOWEB

      # ═══ MEDYA INDIRME (2026-08) ═══════════════════════════════════
      # WAHA VARSAYILAN OLARAK MEDYAYI INDIRMEZ. Bu ayar acik olmadan
      # fotograf/PDF icin 'media' alani bos geliyor ve panelde
      # "Dosya inmedi" yaziyordu. Asil sebep buydu.
      WHATSAPP_DOWNLOAD_MEDIA: "True"
      WHATSAPP_FILES_MIMETYPES: ""          # bos = HEPSI (pdf, foto, ses, video)
      WHATSAPP_FILES_LIFETIME: "0"          # 0 = dosyalari silme
      WAHA_MEDIA_STORAGE: LOCAL

      # Oturum kalici olsun (yeniden baslatinca QR istemesin)
      WHATSAPP_DEFAULT_ENGINE: NOWEB

      # ═══ NOWEB DEPOSU — ZORUNLU (2026-08) ══════════════════════════
      # WAHA'nin kendi hata mesaji:
      #   "Enable NOWEB store config.noweb.store.enabled=True and
      #    config.noweb.store.full_sync=True"
      # Depo KAPALIYKEN WAHA sohbet listesi, grup bilgisi ve gecmis
      # VERMIYOR. Grup adlarinin gelmemesinin, /chats'in bos donmesinin
      # ve gecmisin cekilememesinin sebebi buydu.
      # full_sync: acilista tum sohbet/grup bilgisini WhatsApp'tan ceker.
      WAHA_NOWEB_STORE_ENABLED: "True"
      WAHA_NOWEB_STORE_FULLSYNC: "True"
      WAHA_LOG_LEVEL: info

      # Kopruye olay gonder (mesajlar buraya dusecek)
      # ═══ GLOBAL OLAY ADRESI (2026-08 duzeltmesi) ═══════════════════
      # ESKIDEN kapatilan eski kopruyu (kopru:3002) gosteriyordu — WAHA
      # olaylari olu bir adrese gondermeye calisiyordu. Artik dogrudan
      # CRM'in olay koprusune gidiyor. Oturum ayari da ayrica yaziliyor;
      # bu ikisi birbirinin yedegi.
      WHATSAPP_HOOK_URL: http://host.docker.internal:3210/olay/0
      WHATSAPP_HOOK_EVENTS: message,message.any,message.ack,message.revoked,message.reaction,session.status,state.change,group.v2.update,group.v2.participants,presence.update

      # WAHA arayuzunu sifreyle koru (test sunucusu disari acikken sart)
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_PANEL_SIFRE:-degistir-beni}
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-test-anahtari-degistir}
    volumes:
      - ./waha-veri:/app/.sessions   # oturum dosyalari burada kalir
    # Kutunun icinden SUNUCUYA (host) ulasabilmesi icin — olaylar bu yolla geliyor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [waha-ag]

  # ═══════════════════════════════════════════════════════════════════
  # KOPRU SERVISI KALDIRILDI (2026-08)
  # -------------------------------------------------------------------
  # Eskiden burada ayri bir "kopru" kutusu vardi (kopru:3002) ve WAHA'yi
  # bizim protokole cevirirdi. O yaklasim TERK EDILDI: cevirmen artik
  # CRM'in icinde, 'waha-motor.js' olarak calisiyor. Ayri kutu gerekmiyor.
  #
  # Tanim burada kalinca 'docker compose up' her seferinde onu insa etmeye
  # calisiyor ve Dockerfile olmadigi icin su hatayi veriyordu:
  #     failed to read dockerfile: open Dockerfile: no such file or directory
  # Bu yuzden WAHA kutusu da yeniden olusturulamiyordu.
  # ═══════════════════════════════════════════════════════════════════

networks:
  waha-ag:
    driver: bridge
